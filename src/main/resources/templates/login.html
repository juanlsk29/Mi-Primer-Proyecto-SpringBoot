<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Iniciar sesión · CineReview</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="auth-wrapper">
    <div class="auth-card">
        <div class="brand">
            <div class="clapper">🎬</div>
            <h1>CineReview</h1>
        </div>

        <div class="error-msg" th:if="${param.error}">
            Usuario o contraseña incorrectos.
        </div>
        <div class="success-msg" th:if="${param.logout}">
            Sesión cerrada correctamente.
        </div>
        <div class="success-msg" th:if="${param.registered}">
            Cuenta creada. Ahora inicia sesión.
        </div>

        <form th:action="@{/login}" method="post">
            <div class="field">
                <label for="username">Usuario</label>
                <input type="text" id="username" name="username" required autofocus>
            </div>
            <div class="field">
                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password" required>
            </div>
            <button type="submit" class="btn">Entrar</button>
        </form>

        <div class="switch-link">
            ¿No tienes cuenta? <a th:href="@{/register}">Regístrate</a>
        </div>
    </div>
</div>
</body>
</html>
