<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Registrarse · CineReview</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="auth-wrapper">
    <div class="auth-card">
        <div class="brand">
            <div class="clapper">🎬</div>
            <h1>CineReview</h1>
        </div>

        <form th:action="@{/register}" th:object="${user}" method="post">

            <div class="error-msg" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></div>
            <div class="field">
                <label for="username">Nombre de usuario</label>
                <input type="text" id="username" th:field="*{username}" required autofocus>
            </div>

            <div class="error-msg" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
            <div class="field">
                <label for="email">Correo</label>
                <input type="email" id="email" th:field="*{email}" required>
            </div>

            <div class="error-msg" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
            <div class="field">
                <label for="password">Contraseña</label>
                <input type="password" id="password" th:field="*{password}" required>
            </div>

            <button type="submit" class="btn">Crear cuenta</button>
        </form>

        <div class="switch-link">
            ¿Ya tienes cuenta? <a th:href="@{/login}">Inicia sesión</a>
        </div>
    </div>
</div>
</body>
</html>
